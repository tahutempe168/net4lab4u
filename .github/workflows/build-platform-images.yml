name: Container images

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/platform-images/**'
      - 'deploy/demo-images/**'
      - 'deploy/scripts/*images*.sh'
      - 'deploy/compose/**'
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-platform-images.yml'
  pull_request:
    paths:
      - 'deploy/platform-images/**'
      - 'deploy/demo-images/**'
      - 'deploy/scripts/*images*.sh'
      - 'deploy/compose/**'
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-platform-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NOVA_VE_ACR_REGISTRY: ${{ vars.NOVA_VE_ACR_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Test publication scripts and validate registry
        run: |
          bash deploy/scripts/test-acr-images.sh
          bash deploy/scripts/publish-acr-images.sh --check

      - name: Build all images without publishing
        run: NOVA_VE_ACR_REGISTRY= bash deploy/scripts/build-all-images.sh

      - name: Boot and verify platform images
        shell: bash
        run: |
          trap 'docker logs platform-image; docker rm -f platform-image' EXIT
          for kind in mgmt-server browser desktop; do
            docker run -d --name platform-image "nova-ve/$kind:latest"
            verified=0
            for _ in {1..15}; do
              if bash deploy/scripts/verify-platform-images.sh "$kind" platform-image; then
                verified=1
                break
              fi
              sleep 2
            done
            [[ "$verified" == "1" ]] || exit 1
            docker rm -f platform-image
          done
          trap - EXIT

      - name: Log in to Azure using OIDC
        if: github.ref == 'refs/heads/main' && vars.NOVA_VE_ACR_REGISTRY != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR and publish tested images
        if: github.ref == 'refs/heads/main' && vars.NOVA_VE_ACR_REGISTRY != ''
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          : "${ACR_NAME:?Set the AZURE_ACR_NAME repository variable}"
          az acr login --name "$ACR_NAME"
          bash deploy/scripts/publish-acr-images.sh
